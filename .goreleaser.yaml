version: 2

project_name: git-vault

before:
  hooks:
    - bash scripts/release-artifacts.sh

builds:
  - id: git-vault
    builder: rust
    binary: git-vault
    targets:
      - aarch64-apple-darwin
      - aarch64-unknown-linux-musl
      - x86_64-apple-darwin
      - x86_64-pc-windows-gnu
      - x86_64-unknown-linux-musl

archives:
  - id: binary
    formats: [binary]
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"
  - id: archive
    ids: [git-vault]
    formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - src: target/artifacts/completions/*
        dst: completions
        strip_parent: true
      - src: target/artifacts/man/*
        dst: man
        strip_parent: true
    format_overrides:
      - goos: windows
        formats: [zip]

nfpms:
  - ids: [git-vault]
    package_name: git-vault
    formats: [apk, deb, rpm]
    maintainer: "Roman <roman@lerchster.dev>"
    homepage: "https://github.com/roman-16/git-vault"
    description: "Transparent encryption for git that collapses everything it protects into one opaque file"
    license: MIT
    bindir: /usr/bin
    dependencies:
      - git
    contents:
      - src: ./target/artifacts/completions/git-vault.bash
        dst: /usr/share/bash-completion/completions/git-vault
      - src: ./target/artifacts/completions/git-vault.fish
        dst: /usr/share/fish/vendor_completions.d/git-vault.fish
      - src: ./target/artifacts/completions/git-vault.zsh
        dst: /usr/share/zsh/site-functions/_git-vault
      - src: ./target/artifacts/man/
        dst: /usr/share/man/man1/
      - src: ./LICENSE
        dst: /usr/share/doc/git-vault/copyright
        packager: deb
      - src: ./LICENSE
        dst: /usr/share/licenses/git-vault/LICENSE
        packager: rpm

aurs:
  - name: git-vault-bin
    ids: [archive]
    homepage: "https://github.com/roman-16/git-vault"
    description: "Transparent encryption for git that collapses everything it protects into one opaque file"
    maintainers:
      - "Roman <roman@lerchster.dev>"
    license: MIT
    private_key: "{{ .Env.AUR_KEY }}"
    git_url: "ssh://aur@aur.archlinux.org/git-vault-bin.git"
    commit_author:
      name: Roman
      email: roman@lerchster.dev
    depends:
      - git
    package: |-
      install -Dm755 "./git-vault" "${pkgdir}/usr/bin/git-vault"
      install -Dm644 "./LICENSE" "${pkgdir}/usr/share/licenses/git-vault-bin/LICENSE"
      install -Dm644 "./completions/git-vault.bash" "${pkgdir}/usr/share/bash-completion/completions/git-vault"
      install -Dm644 "./completions/git-vault.fish" "${pkgdir}/usr/share/fish/vendor_completions.d/git-vault.fish"
      install -Dm644 "./completions/git-vault.zsh" "${pkgdir}/usr/share/zsh/site-functions/_git-vault"
      for page in ./man/*.1; do
        install -Dm644 "$page" "${pkgdir}/usr/share/man/man1/$(basename "$page")"
      done

homebrew_casks:
  - name: git-vault
    ids: [archive]
    repository:
      owner: roman-16
      name: homebrew-tap
      token: "{{ .Env.TAP_WINGET_TOKEN }}"
    commit_author:
      name: Roman
      email: roman@lerchster.dev
    homepage: "https://github.com/roman-16/git-vault"
    description: "Transparent encryption for git that collapses everything it protects into one opaque file"
    license: MIT
    binaries:
      - git-vault
    completions:
      bash: completions/git-vault.bash
      fish: completions/git-vault.fish
      zsh: completions/git-vault.zsh
    manpages:
      - man/git-vault.1

winget:
  - name: git-vault
    publisher: Roman-16
    package_identifier: Roman-16.GitVault
    path: "manifests/r/Roman-16/GitVault/{{ .Version }}"
    ids: [archive]
    commit_author:
      name: Roman
      email: roman@lerchster.dev
    homepage: "https://github.com/roman-16/git-vault"
    short_description: "Transparent encryption for git"
    description: "Transparent encryption for git that collapses everything it protects into one opaque file"
    license: MIT
    publisher_url: "https://github.com/roman-16"
    publisher_support_url: "https://github.com/roman-16/git-vault/issues"
    tags:
      - cli
      - encryption
      - git
      - secrets
    repository:
      owner: roman-16
      name: winget-pkgs
      branch: "git-vault-{{ .Version }}"
      token: "{{ .Env.TAP_WINGET_TOKEN }}"
      pull_request:
        enabled: true
        base:
          owner: microsoft
          name: winget-pkgs
          branch: master

checksum:
  name_template: "checksums.txt"
  algorithm: sha256

changelog:
  sort: asc

release:
  draft: false
  mode: replace
  replace_existing_artifacts: true
